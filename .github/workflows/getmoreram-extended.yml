name: Build unsigned GetMoreRamExtended for iOS 18
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile pinned helper without Apple signing
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: python3 -u scripts/build_getmoreram.py "$RUNNER_TEMP/getmoreram"
      - name: Retain verified unsigned helper privately
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: python3 -u scripts/build_getmoreram.py publish "$RUNNER_TEMP/getmoreram"
