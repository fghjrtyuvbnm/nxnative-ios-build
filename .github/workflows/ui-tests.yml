name: External folder launcher simulator tests
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-build-setup
      - name: Foundation lifecycle regression
        run: |
          swiftc -swift-version 5 -parse-as-library runtime/GameDataCore.swift runtime/tests/GameDataCoreTests.swift -o "$RUNNER_TEMP/core-tests"
          "$RUNNER_TEMP/core-tests"
      - name: Production launcher on iOS Simulator without any game resources
        run: python -u scripts/test_external_ui.py "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/ui-tests"
      - name: Print test diagnostics without game data
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ui-tests/stock.log" "$RUNNER_TEMP/ui-tests/external.log"; do
            if [ -f "$log" ]; then tail -100 "$log"; fi
          done
