name: Validate classic Metal queue and weak-resource lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run original and candidate synthetic Metal contracts
        run: python3 -u scripts/validate_ios18_lifecycle.py "$RUNNER_TEMP/classic-lifecycle"
